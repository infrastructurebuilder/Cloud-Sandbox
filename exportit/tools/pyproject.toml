[project]
name = "exportit-tools"
version = "0.1.0"
description = "Copies units of Cloud-Sandbox into exportit/ and checks the copies"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PL", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.pyright]
include = ["export.py", "configs_copy.py", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
