# The units a Cloud Sandbox is made of, and the version of each that goes
# into one. This file is the umbrella's reason to exist (stage 8, decision 3):
# a sandbox is these versions, applied in this order.
#
#   name      the unit
#   repository  where the unit lives. Every repository is on
#             infrastructurebuilder; a unit's is named csis-<name>, except
#             cloudflow's and the collection's, which carry their own names.
#   version   the version that goes into a sandbox. Where the unit has a
#             pyproject.toml it is that file's version; for the others it is
#             the first tag, cut when the unit was given its repository.
#   kind      what it is: python, ansible, terraform, scripts, data
#   step      when it is applied while building a sandbox (README.md)
#   relocate  the order of the real relocations: a unit goes after every unit
#             it needs
#   needs     units it refers to by version, which must exist first
#   external  true for a unit that already lives in a repository of its own
#             and is not copied into exportit/; its relocate is 0
#
# Since moving day (2026-11-17) every unit is a private repository of its own,
# and Cloud-Sandbox holds each as a git submodule under exportit/, beside the
# originals they were copied from, which are still there. The one external
# unit was begun in its own repository and was never part of Cloud-Sandbox.
# The umbrella itself, this directory, is csis-cloud-sandbox.
# tests/check_units.py holds this file consistent.

[[unit]]
name = "sandbox-terraform"
repository = "https://github.com/infrastructurebuilder/csis-sandbox-terraform"
version = "0.0.1"
kind = "terraform"
step = 1
relocate = 6
needs = ["sandbox-provisioning"]
what = "the network, EFS volume, IAM role, placement group and head node"

[[unit]]
name = "ansible-collection-csis-spack"
repository = "https://github.com/infrastructurebuilder/ansible-collection-csis-spack"
version = "0.3.1"
kind = "ansible"
step = 2
relocate = 0
needs = []
external = true
what = "the Ansible collection infrastructurebuilder.csis_spack: the modules that run Spack for sandbox-provisioning"

[[unit]]
name = "sandbox-provisioning"
repository = "https://github.com/infrastructurebuilder/csis-sandbox-provisioning"
version = "0.0.1"
kind = "ansible"
step = 2
relocate = 5
needs = ["ansible-collection-csis-spack"]
what = "the head node's software (site.yml), the compute-node image, users, JupyterHub"

[[unit]]
name = "cloudflow"
repository = "https://github.com/infrastructurebuilder/cloudflow"
version = "1.6.0b0"
kind = "python"
step = 3
relocate = 1
needs = []
what = "the workflow engine that starts compute nodes and runs the models, and the plots of their output"

[[unit]]
name = "model-common"
repository = "https://github.com/infrastructurebuilder/csis-model-common"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 2
needs = []
what = "the module files and notes the model recipes share"

[[unit]]
name = "model-adcirc-cora"
repository = "https://github.com/infrastructurebuilder/csis-model-adcirc-cora"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
needs = ["model-common"]
what = "ADCIRC for the CORA reanalysis"

[[unit]]
name = "model-eccofs"
repository = "https://github.com/infrastructurebuilder/csis-model-eccofs"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
needs = []
what = "ECCOFS (ROMS), from the NOSOFS code package"

[[unit]]
name = "model-liveocean"
repository = "https://github.com/infrastructurebuilder/csis-model-liveocean"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
needs = []
what = "LiveOcean (ROMS)"

[[unit]]
name = "model-necofs"
repository = "https://github.com/infrastructurebuilder/csis-model-necofs"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
needs = []
what = "NECOFS (FVCOM)"

[[unit]]
name = "model-nosofs"
repository = "https://github.com/infrastructurebuilder/csis-model-nosofs"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
needs = []
what = "the NOS operational forecast systems (ROMS and FVCOM)"

[[unit]]
name = "model-secofs"
repository = "https://github.com/infrastructurebuilder/csis-model-secofs"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
needs = []
what = "SECOFS (SCHISM)"

[[unit]]
name = "model-ucla-roms"
repository = "https://github.com/infrastructurebuilder/csis-model-ucla-roms"
version = "0.0.1"
kind = "scripts"
step = 4
relocate = 3
