---
# create_spack-environment and build_spack-environment: the Spack environment
# that holds ESMF and PETSc, and its module files.
#
# In the script the Intel modules loaded by install_intel_oneapi_dnf are still
# loaded when these two functions run, because all the functions share one
# shell. Every Spack step here loads them first, for the same surroundings.
# Spack is called with "-e <environment>" where the script activates the
# environment and then calls it.

# Replaces funcs-setup-instance.sh L744
- name: Look for the save directory
  ansible.builtin.stat:
    path: "{{ sandbox_save_dir }}"
  register: spack_environment_save

# Replaces funcs-setup-instance.sh L744-L747
- name: Say so when there is nowhere to put the environment
  ansible.builtin.debug:
    msg: "{{ sandbox_save_dir }} does not exist. Setup the paths first."
  when: not spack_environment_save.stat.exists

# Replaces funcs-setup-instance.sh L749-L753
# The script's "env create" fails on a second run because the environment
# exists. Here it is created when its spack.yaml is missing.
- name: Create the Spack environment
  ansible.builtin.command:
    cmd: "{{ spack_exe }} env create {{ spack_environment_dir }}"
    creates: "{{ spack_environment_dir }}/spack.yaml"
  become: true
  become_user: "{{ sandbox_user }}"
  when: spack_environment_save.stat.exists

# Replaces funcs-setup-instance.sh L754-L762
- name: Configure the environment
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      before=$(sha256sum {{ spack_environment_dir }}/spack.yaml)
      {% for setting in spack_environment_settings %}
      {{ spack_exe }} -e {{ spack_environment_dir }} config add '{{ setting }}'
      {% endfor %}
      after=$(sha256sum {{ spack_environment_dir }}/spack.yaml)
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  register: spack_environment_configure
  changed_when: "'SPACK-CHANGED' in spack_environment_configure.stdout"
  when: spack_environment_save.stat.exists

# Replaces funcs-setup-instance.sh L775-L806
- name: Add ESMF and PETSc to the environment
  ansible.builtin.shell:
    cmd: |
      {{ sandbox_modules_init }}
      set -eo pipefail
      {{ sandbox_load_intel_modules }}
      before=$(sha256sum {{ spack_environment_dir }}/spack.yaml)
      {% for spec in spack_environment_specs %}
      {{ spack_exe }} -e {{ spack_environment_dir }} add '{{ spec }}'
      {% endfor %}
      after=$(sha256sum {{ spack_environment_dir }}/spack.yaml)
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  register: spack_environment_add
  changed_when: "'SPACK-CHANGED' in spack_environment_add.stdout"

# Replaces funcs-setup-instance.sh L812
# The script keeps the output in log.concretize in whatever directory it was
# started from; here it is kept in the environment's own directory.
- name: Work out what has to be built
  ansible.builtin.shell:
    cmd: |
      {{ sandbox_modules_init }}
      set -eo pipefail
      {{ sandbox_load_intel_modules }}
      lock={{ spack_environment_dir }}/spack.lock
      before=$(sha256sum "$lock" 2>/dev/null || true)
      {{ spack_exe }} -e {{ spack_environment_dir }} concretize --force --fresh 2>&1 \
        | tee {{ spack_environment_dir }}/log.concretize
      after=$(sha256sum "$lock")
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  register: spack_environment_concretize
  changed_when: "'SPACK-CHANGED' in spack_environment_concretize.stdout"

# Replaces funcs-setup-instance.sh L817
# The script lets the build's output run to its own log. Here it goes to
# log.install in the environment's directory, and the end of it is shown.
- name: Build and install the environment (hours, the first time)
  ansible.builtin.shell:
    cmd: |
      {{ sandbox_modules_init }}
      set -eo pipefail
      {{ sandbox_load_intel_modules }}
      installed() { {{ spack_exe }} -e {{ spack_environment_dir }} find --format '{hash}' | sort | sha256sum; }
      log={{ spack_environment_dir }}/log.install
      before=$(installed)
      {{ spack_exe }} -e {{ spack_environment_dir }} install {{ spack_opts }} > "$log" 2>&1 \
        || { tail -50 "$log"; exit 1; }
      tail -5 "$log"
      after=$(installed)
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  async: "{{ spack_environment_build_timeout }}"
  poll: 60
  register: spack_environment_install
  changed_when: "'SPACK-CHANGED' in spack_environment_install.stdout"

# Replaces funcs-setup-instance.sh L820-L822
# The module files are written again on every run, as in the script. A change
# is reported only when their contents differ.
- name: Regenerate the environment's module files
  ansible.builtin.shell:
    cmd: |
      {{ sandbox_modules_init }}
      set -eo pipefail
      {{ sandbox_load_intel_modules }}
      modulefiles() {
        find {{ spack_environment_modules_root }} -type f -exec sha256sum {} + 2>/dev/null | sort | sha256sum
      }
      before=$(modulefiles)
      {{ spack_exe }} -e {{ spack_environment_dir }} module tcl refresh --delete-tree -y
      after=$(modulefiles)
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  register: spack_environment_modules
  changed_when: "'SPACK-CHANGED' in spack_environment_modules.stdout"
