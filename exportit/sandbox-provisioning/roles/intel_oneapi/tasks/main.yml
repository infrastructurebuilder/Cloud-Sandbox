---
# install_intel_oneapi_dnf: the Intel compilers, MKL and MPI from Intel's
# repository, their module files, and Spack told to use them.

# Replaces funcs-setup-instance.sh L891-L899
# tests/test_parity.py compares this file with the text in the script.
- name: Add Intel's oneAPI repository
  ansible.builtin.copy:
    src: oneAPI.repo
    dest: /etc/yum.repos.d/oneAPI.repo
    mode: "0644"

# Replaces funcs-setup-instance.sh L902
- name: Install the LLVM packages the script installs first
  ansible.builtin.dnf:
    name: "{{ intel_oneapi_llvm_packages }}"
    state: present

# Replaces funcs-setup-instance.sh L904-L909
- name: Install the Intel compilers, MKL and MPI
  ansible.builtin.dnf:
    name: "{{ intel_oneapi_packages }}"
    state: present

# Replaces funcs-setup-instance.sh L921-L922
# The script regenerates the module files on every run. Here they are
# generated when the compiler's module file for this version is missing.
- name: Generate the module files for oneAPI
  ansible.builtin.command:
    cmd: "./modulefiles-setup.sh --force --ignore-latest --output-dir={{ intel_oneapi_modulefiles_dir }}"
    chdir: "{{ intel_oneapi_root }}"
    creates: "{{ intel_oneapi_modulefiles_dir }}/compiler/{{ oneapi_version }}"

# Replaces funcs-setup-instance.sh L919 L928-L937
- name: Let Spack find the Intel compilers
  ansible.builtin.shell:
    cmd: |
      {{ sandbox_modules_init }}
      set -eo pipefail
      {{ sandbox_load_intel_modules }}
      before=$({{ spack_fingerprint }})
      {{ spack_exe }} compiler find --scope site
      after=$({{ spack_fingerprint }})
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  register: intel_oneapi_compilers
  changed_when: "'SPACK-CHANGED' in intel_oneapi_compilers.stdout"

# Replaces funcs-setup-instance.sh L709-L732 L941-L949
# The function add_spack_site_external, kept as the shell it is: it already
# takes care not to add a package twice.
- name: Tell Spack that MKL and MPI are installed outside it
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      file={{ intel_oneapi_spack_packages_file }}
      mkdir -p "$(dirname "$file")"
      if [ ! -f "$file" ]; then
        printf '%s\n' 'packages:' > "$file"
      fi
      if grep -q "^  {{ item.package }}:" "$file"; then
        exit 0
      fi
      cat >> "$file" <<EOF
        {{ item.package }}:
          externals:
          - spec: {{ item.spec }}
            prefix: {{ item.prefix }}
          buildable: false

      EOF
      echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  loop: "{{ intel_oneapi_spack_externals }}"
  loop_control:
    label: "{{ item.package }}"
  register: intel_oneapi_externals
  changed_when: "'SPACK-CHANGED' in intel_oneapi_externals.stdout"

# Replaces funcs-setup-instance.sh L951-L955 L959
# The script's "mirror add" between these lines is not carried: see
# tests/not_carried.yml.
- name: Make the Intel libraries Spack's providers
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      spack={{ spack_exe }}
      before=$({{ spack_fingerprint }})
      {% for provider in intel_oneapi_spack_providers %}
      $spack config --scope site add '{{ provider }}'
      {% endfor %}
      $spack buildcache keys --install --trust
      after=$({{ spack_fingerprint }})
      [ "$before" = "$after" ] || echo SPACK-CHANGED
    executable: /bin/bash
  become: true
  become_user: "{{ sandbox_user }}"
  register: intel_oneapi_providers
  changed_when: "'SPACK-CHANGED' in intel_oneapi_providers.stdout"
