[project]
name = "sandbox-configs"
version = "0.0.1"
description = "The job and cluster descriptions a Cloud Sandbox runs cloudflow with"
requires-python = ">=3.12"
dependencies = []

# Python is only the test harness; the descriptions are plain JSON.
[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PL", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.pyright]
include = ["tests"]
extraPaths = ["tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
